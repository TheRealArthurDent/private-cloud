---
# Clean-slate restore, the same as opencloud's (tasks/restore.yaml there): on a fresh host, the stack's volumes come
# back from the latest resticprofile snapshot before the containers start. infrastructure's stack role installs the
# helper; this stack lists its volumes in /etc/restic-restore/stacks/ and calls it. A marker makes every later run a
# no-op, and a host that already has data only gets the marker. The live database isn't restored: Postgres imports
# the restored dump on its first start (docker-compose.yaml).

- name: Stat the restore helper
  ansible.builtin.stat:
    path: "{{ paperless_restore_helper }}"
  register: paperless_restore_helper_stat

- name: Ensure the restore helper is installed
  ansible.builtin.assert:
    that: paperless_restore_helper_stat.stat.exists
    fail_msg: >-
      {{ paperless_restore_helper }} is missing. Run infrastructure's bootstrap.yaml on {{ inventory_hostname }} first.
    quiet: true

- name: Start with no volumes to restore
  ansible.builtin.set_fact:
    paperless_restore_items: {}

- name: Read the services of the compose file
  ansible.builtin.set_fact:
    paperless_compose_services: >-
      {{ (lookup('ansible.builtin.file', paperless_repo_dir ~ '/paperless/docker-compose.yaml') | from_yaml).services }}

- name: Collect the volumes to restore
  ansible.builtin.set_fact:
    paperless_restore_items: >-
      {{ paperless_restore_items | combine({item.key: {
           'paths': [paperless_docker_volumes_dir ~ '/' ~ paperless_project_name ~ '_' ~ item.key ~ '/_data'],
           'containers': item.value.services | map('extract', paperless_compose_services)
                         | map(attribute='container_name') | list,
           'preserve': item.value.preserve,
           'note': item.value.note}}) }}
  loop: "{{ paperless_restore_volumes | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Ensure the volumes are listed for the restore helper
  ansible.builtin.copy:
    content: "{{ {'items': paperless_restore_items} | to_nice_json }}\n"
    dest: /etc/restic-restore/stacks/{{ paperless_project_name }}.json
    owner: root
    group: root
    mode: '0644'
  register: paperless_restore_items_file

# Docker doesn't register a restored _data directory by itself. With the labels Compose sets, compose up adopts
# the volume instead of warning that it was created outside the project (infrastructure#296). An existing volume is
# left alone.
- name: Ensure the volumes to restore exist with the labels of the compose project
  community.docker.docker_volume:
    name: "{{ paperless_project_name }}_{{ item }}"
    labels:
      com.docker.compose.project: "{{ paperless_project_name }}"
      com.docker.compose.volume: "{{ item }}"
    state: present
  loop: "{{ paperless_restore_items | list }}"
  when: paperless_manage_containers | bool

# In check mode the item list isn't written: where it is due for an update, the dry run would use the old one or
# none (infrastructure's stack role does the same).
- name: Check whether the dry run can use the deployed item list
  ansible.builtin.set_fact:
    paperless_restore_dry_run_possible: "{{ not (ansible_check_mode and paperless_restore_items_file is changed) }}"

- name: Ensure the volumes are restored on a fresh host
  ansible.builtin.command:
    argv: >-
      {{ [paperless_restore_helper, '--runner', 'oneoff', 'clean-slate', paperless_project_name,
          '--snapshot', paperless_restore_snapshot]
         + (['--skip'] if paperless_skip_restore | bool else [])
         + (['--dry-run'] if ansible_check_mode else []) }}
  register: paperless_restore
  changed_when: paperless_restore.rc == 0 and (paperless_restore.stdout | from_json).changed
  # Fails in the next task, with the next step for the user
  failed_when: false
  # Read-only with --dry-run, so it also reports in check mode what a real run would do
  check_mode: false
  when: paperless_restore_dry_run_possible | bool

- name: Ensure the restore succeeded
  ansible.builtin.fail:
    msg: "{{ paperless_restore.stderr }}\n{{ paperless_restore_hints[paperless_restore.rc] | default('') }}"
  vars:
    paperless_restore_hints:
      10: >-
        Check that the backup host accepts this host's restic SSH key: run infrastructure's
        sudo /etc/docker/infrastructure/init-restic.sh on the host, then run the playbook again.
      11: >-
        If this is a new host with nothing to restore, run the playbook again with -e skip_paperless_restore=true.
  when: paperless_restore is not skipped and paperless_restore.rc != 0

- name: Report the restore
  ansible.builtin.debug:
    msg: "{{ (paperless_restore.stdout | from_json).msg }}"
  when: paperless_restore is not skipped

- name: Report the restore in check mode before the item list is up to date
  ansible.builtin.debug:
    msg: >-
      The item list isn't deployed yet, so no dry run: a real run restores
      {{ paperless_restore_items | list | join(', ') }} from snapshot {{ paperless_restore_snapshot }} unless the
      marker exists, the host has data already or skip_paperless_restore is set.
  when: paperless_restore is skipped
